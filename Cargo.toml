[package]
name = "herdr-white-noise-bridge"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "0.8"
anyhow = "1"
bech32 = "0.9"
hex = "0.4"
tokio = { version = "1", features = ["full"] }
tempfile = "3"
fs2 = "0.4"
uuid = { version = "1", features = ["v4", "serde"] }
