name: Build and release

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check release versions
        run: |
          python3 - <<'PY'
          import os
          import tomllib
          from pathlib import Path
          version = tomllib.loads(Path('Cargo.toml').read_text())['package']['version']
          manifest = tomllib.loads(Path('herdr-plugin.toml').read_text())
          assert manifest['version'] == version, 'Cargo and plugin versions differ'
          if os.environ['GITHUB_REF'].startswith('refs/tags/'):
              assert os.environ['GITHUB_REF_NAME'] == 'v' + version, 'Tag and package versions differ'
          PY
      - run: cargo fmt --all --check
      - run: cargo test --locked --tests
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: python3 -m unittest discover -s tests -p 'test_*.py' -v

  checks-macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: cargo test --locked --tests
      - run: python3 -m unittest discover -s tests -p 'test_*.py' -v

  binaries:
    needs: [checks, checks-macos]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            os: linux
            arch: x86_64
            target: x86_64-unknown-linux-musl
            rustflags: '-C linker=musl-gcc'
          - runner: ubuntu-24.04-arm
            os: linux
            arch: aarch64
            target: aarch64-unknown-linux-musl
            rustflags: '-C linker=musl-gcc'
          - runner: macos-15
            os: macos
            arch: aarch64
            target: aarch64-apple-darwin
            rustflags: ''
          - runner: macos-15-intel
            os: macos
            arch: x86_64
            target: x86_64-apple-darwin
            rustflags: ''
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install native musl linker
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build and package
        env:
          TARGET: ${{ matrix.target }}
          OS_NAME: ${{ matrix.os }}
          ARCH: ${{ matrix.arch }}
          RUSTFLAGS: ${{ matrix.rustflags }}
        run: |
          cargo build --locked --release --target "$TARGET"
          "target/$TARGET/release/herdr-white-noise-bridge" --version
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          mkdir -p dist
          if [ "$OS_NAME" = macos ]; then
            codesign --force --sign - "target/$TARGET/release/herdr-white-noise-bridge"
            codesign --verify --strict "target/$TARGET/release/herdr-white-noise-bridge"
          fi
          asset="codr-v$version-$OS_NAME-$ARCH.tar.gz"
          tar -czf "dist/$asset" -C "target/$TARGET/release" herdr-white-noise-bridge
          if [ "$OS_NAME" = macos ]; then
            shasum -a 256 "dist/$asset" > "dist/$asset.sha256"
          else
            sha256sum "dist/$asset" > "dist/$asset.sha256"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: codr-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: binaries
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: codr-*
          merge-multiple: true
          path: dist
      - name: Publish versioned release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "codr $GITHUB_REF_NAME" --generate-notes --verify-tag
