name: Build and release

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check release versions
        run: |
          python3 - <<'PY'
          import os
          import tomllib
          from pathlib import Path
          version = tomllib.loads(Path('Cargo.toml').read_text())['package']['version']
          manifest = tomllib.loads(Path('herdr-plugin.toml').read_text())
          assert manifest['version'] == version, 'Cargo and plugin versions differ'
          if os.environ['GITHUB_REF'].startswith('refs/tags/'):
              assert os.environ['GITHUB_REF_NAME'] == 'v' + version, 'Tag and package versions differ'
          PY
      - run: cargo fmt --all --check
      - run: cargo test --locked --tests
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: python3 -m unittest discover -s tests -p 'test_*.py' -v

  binaries:
    needs: checks
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
            target: x86_64-unknown-linux-musl
          - runner: ubuntu-24.04-arm
            arch: aarch64
            target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install native musl linker
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build and package
        env:
          TARGET: ${{ matrix.target }}
          ARCH: ${{ matrix.arch }}
          RUSTFLAGS: '-C linker=musl-gcc'
        run: |
          cargo build --locked --release --target "$TARGET"
          "target/$TARGET/release/herdr-white-noise-bridge" --version
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')
          mkdir -p dist
          asset="codr-v$version-linux-$ARCH.tar.gz"
          tar -czf "dist/$asset" -C "target/$TARGET/release" herdr-white-noise-bridge
          sha256sum "dist/$asset" > "dist/$asset.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: codr-linux-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: binaries
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: codr-linux-*
          merge-multiple: true
          path: dist
      - name: Publish versioned release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "codr $GITHUB_REF_NAME" --generate-notes --verify-tag
